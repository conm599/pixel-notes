server {
    listen 443 ssl http2;
    server_name mcft.naxid.top;
    ssl_certificate /etc/nginx/ssl/mcft.origin.pem;
    ssl_certificate_key /etc/nginx/ssl/mcft.origin.key;
    root /var/www/tuchang;
    index index.php index.html;
    client_max_body_size 16m;
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 8h;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-tuchang-fpm.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }
    location ~ /\.(?!well-known) { deny all; }
}
