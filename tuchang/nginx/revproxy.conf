server {
    listen 80;
    server_name bianqian.naxid.top tuchang.naxid.top mcft.naxid.top;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
# ===== ��ǩվ������ PHP��www �أ� =====
server {
    listen 443 ssl http2;
    server_name bianqian.naxid.top;
    ssl_certificate /etc/letsencrypt/live/bianqian.naxid.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bianqian.naxid.top/privkey.pem;
    root /var/www/hosting;
    index index.php index.html;
    client_max_body_size 64m;
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf|mp3|mp4|ogg|webm|wav)$ {
        try_files $uri =404;
        expires 8h;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }
    location ^~ /config/ { deny all; }
    location ^~ /data/ { deny all; }
    location = /config.php { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
